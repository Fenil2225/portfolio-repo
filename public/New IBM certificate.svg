      <stop offset="0%" style="stop-color:#003399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001a4d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#ibmGrad)" />
  <rect x="60" y="60" width="1080" height="680" rx="12" fill="none" stroke="#00d4ff" stroke-width="2" />
  <text x="600" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#00d4ff">IBM CERTIFIED</text>
